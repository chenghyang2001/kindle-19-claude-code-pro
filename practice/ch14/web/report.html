<!DOCTYPE html>
<html lang="zh-TW">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>訂單報表</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; }
  .bar { fill: #3b82f6; } .lbl { font-size: 12px; fill: #333; }
  #err { color: #b91c1c; }
</style></head>
<body>
<main>
  <h1>訂單報表</h1>
  <form id="f">
    <label>起 <input type="date" id="from" value="2026-10-01"></label>
    <label>迄 <input type="date" id="to" value="2026-10-03"></label>
    <select id="status" aria-label="狀態"><option value="">全部</option><option>paid</option><option>refunded</option><option>pending</option></select>
    <button>查詢</button> <a id="csv" href="#">匯出 CSV</a>
  </form>
  <p id="err" role="alert"></p>
  <p id="total"></p>
  <svg id="chart" width="100%" height="240" viewBox="0 0 600 240" aria-label="每日營收長條圖"></svg>
</main>
<script>
// 子任務 C：只依賴 API 合約 {data:{rows:[{day,orders,revenue}],total}}，所以可與後端並行開發
const $ = (id) => document.getElementById(id);
function qs() {
  const p = new URLSearchParams({ from: $("from").value, to: $("to").value });
  if ($("status").value) p.set("status", $("status").value);
  return p.toString();
}
function draw(rows) {
  const svg = $("chart"); svg.textContent = "";
  const max = Math.max(1, ...rows.map(r => r.revenue));
  const w = 600 / Math.max(rows.length, 1);
  const ns = "http://www.w3.org/2000/svg";
  rows.forEach((r, i) => {
    const h = (r.revenue / max) * 190;
    const rect = document.createElementNS(ns, "rect");
    rect.setAttribute("class", "bar"); rect.setAttribute("x", i * w + 10);
    rect.setAttribute("y", 210 - h); rect.setAttribute("width", w - 20); rect.setAttribute("height", h);
    const t = document.createElementNS(ns, "text");
    t.setAttribute("class", "lbl"); t.setAttribute("x", i * w + 10); t.setAttribute("y", 230);
    t.textContent = r.day + "  $" + r.revenue;
    svg.append(rect, t);
  });
}
async function load(e) {
  if (e) e.preventDefault();
  $("err").textContent = "";
  $("csv").href = "/api/reports/orders.csv?" + qs();
  try {
    const res = await fetch("/api/reports/orders?" + qs());
    const body = await res.json();
    if (!res.ok) throw new Error(body.error?.message ?? "查詢失敗");
    $("total").textContent = "合計 " + body.data.total.orders + " 筆，營收 $" + body.data.total.revenue;
    draw(body.data.rows);
  } catch (err) {
    $("err").textContent = "錯誤：" + err.message;
    draw([]);
  }
}
$("f").addEventListener("submit", load);
load();
</script>
</body></html>
